# Pipeline CI de Induplac: cada push o pull request pasa por estas etapas.
# Si una falla, el cambio no avanza (no se despliega).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: induplac
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: induplac_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks revisa los commits del PR: necesita el historial completo
      - name: Buscar secretos expuestos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt bandit pip-audit
      - name: Análisis estático de seguridad (SAST)
        run: bandit -q -r backend/app -ll
      - name: Dependencias con vulnerabilidades conocidas
        run: pip-audit -r backend/requirements.txt
      - name: Pruebas unitarias e integración (PostgreSQL real)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://induplac:ci@localhost:5432/induplac_test
        run: pytest -v
      - name: Construir imagen Docker
        run: docker build -f backend/Dockerfile -t induplac-api:${{ github.sha }} .
