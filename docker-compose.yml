# Induplac MVP: API + dashboard + PostgreSQL en un solo host (PC del equipo o EC2 de AWS Academy).
# Los gateways corren en cada sede (en la demo: en el notebook) y apuntan a la IP de este host.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: induplac
      POSTGRES_USER: induplac
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U induplac"]
      interval: 5s
      retries: 10
    # Sin "ports": la base de datos no es accesible desde fuera del host.

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://induplac:${DB_PASSWORD}@db:5432/induplac
    ports:
      - "8000:8000"

volumes:
  pgdata:
