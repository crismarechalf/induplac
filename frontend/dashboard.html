<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Induplac · Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="barra">
    <div class="marca">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="5" width="20" height="5" rx="1" fill="#17A9C9"/>
        <rect x="6" y="13.5" width="20" height="5" rx="1" fill="#1E5FBF"/>
        <rect x="9" y="22" width="20" height="5" rx="1" fill="#E9EEF6"/>
      </svg>
      <span>Induplac</span>
    </div>
    <p class="perfil-activo">Perfil: <strong id="perfil-nombre"></strong></p>
    <p id="conexion" class="conexion" role="status"><span class="punto" aria-hidden="true"></span><span class="conexion-texto">Conectando…</span></p>
    <button id="salir" class="btn-salir">Salir</button>
  </header>

  <main class="tablero">
    <div id="sedes" class="sedes"></div>

    <aside class="panel alertas" aria-labelledby="titulo-alertas">
      <h2 id="titulo-alertas">Alertas activas <span id="total-alertas" class="contador">0</span></h2>
      <ul id="lista-alertas" class="lista-alertas" aria-live="polite"></ul>
    </aside>

    <section id="historico" class="panel historico" aria-labelledby="titulo-historico">
      <div class="historico-cabecera">
        <h2 id="titulo-historico">Histórico últimas 24 h</h2>
        <label>Sede <select id="hist-sede"></select></label>
        <label>Variable <select id="hist-variable"></select></label>
      </div>
      <div class="lienzo"><canvas aria-label="Gráfico histórico de la variable seleccionada" role="img"></canvas></div>
    </section>
  </main>

  <footer class="leyenda" aria-label="Leyenda de estados">
    <span>Leyenda:</span>
    <span class="estado" data-estado="normal"><svg class="icono" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.3l2 2 4-4.3"/></svg><span>Normal</span></span>
    <span class="estado" data-estado="advertencia"><svg class="icono" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l6.6 11.8H1.4z"/><path d="M8 6.3v3.2M8 11.6v.1"/></svg><span>Advertencia</span></span>
    <span class="estado" data-estado="critico"><svg class="icono" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8"/></svg><span>Crítico</span></span>
    <span class="estado" data-estado="sin_datos"><svg class="icono" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5" stroke-dasharray="2.4 2.2"/><path d="M5.3 8h5.4"/></svg><span>Sin datos</span></span>
  </footer>

  <script>
    // Abierto como archivo (file://) los módulos ES no cargan: avisar en vez de mostrar una página vacía.
    if (location.protocol === 'file:') document.body.innerHTML = '<p class="aviso-file">Abre esta página con un servidor: en la carpeta <code>frontend</code> ejecuta <code>python -m http.server 8000</code> y entra a <code>http://localhost:8000</code>.</p>';
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
